server.port=9090

# ── LLM Provider: claude | openai ────────────────────────────────────────────
llm.provider=claude

# ── Anthropic / Claude ───────────────────────────────────────────────────────
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-3-5-sonnet-20241022
anthropic.max-tokens=2048
anthropic.temperature=0.7

# ── OpenAI / GPT (fallback) ──────────────────────────────────────────────────
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4o
openai.max-tokens=2048
openai.temperature=0.7

# ── Session ───────────────────────────────────────────────────────────────────
# Session TTL in minutes
session.ttl-minutes=60
# Max history messages per session
session.max-history=50

# ── CORS ─────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:8080

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.ops.chat=DEBUG
logging.level.dev.langchain4j=INFO
