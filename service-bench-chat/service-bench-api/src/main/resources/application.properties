# ── Server ───────────────────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.headers=Content-Type,Accept,Authorization
quarkus.http.cors.methods=GET,POST,OPTIONS

# ── GraphQL ───────────────────────────────────────────────────────────────────
# Enable the GraphQL UI at /q/graphql-ui in dev mode
quarkus.smallrye-graphql.ui.always-include=true
# Allow GET requests (needed for SSE subscription transport)
quarkus.smallrye-graphql.http.get.enabled=true
# Enable SSE for subscriptions (as opposed to WebSocket)
quarkus.smallrye-graphql.events.enabled=true
# Schema introspection
quarkus.smallrye-graphql.schema-available=true

# ── Ops Chat Service REST client ──────────────────────────────────────────────
quarkus.rest-client.ops-chat.url=${OPS_CHAT_URL:http://localhost:9090}
quarkus.rest-client.ops-chat.scope=jakarta.inject.Singleton

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.servicebench".level=DEBUG
